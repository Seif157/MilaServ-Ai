# Answer templates — spec for Laravel. Architecture §9.1.
# Status: draft · 2026-09-21
#
# How Laravel uses this file
# - One entry per question type (architecture §7), with the query in docs/specs/catalogue.md.
# - `self` — the asker asking about themselves. `team_member` — a manager asking about someone in
#   their direct team. `my_team` has only `self`: it is always about the asker's own team.
# - rows: one  → `text` is filled from the single row.
#   rows: many → `intro` once, then `row` once per row, one line each.
# - Every {placeholder} is a column in that question type's SELECT list, or {subject_name}.
#   {subject_name} is the team member's name from the resolver — ar: first_name_local
#   last_name_local, falling back to first_name last_name; en: first_name last_name. It appears only
#   in team_member templates.
# - Values are filled by code, never by the AI. Numbers: Western digits, thousands separators.
#   Dates: YYYY-MM-DD. A null value shows as —.
# - A column listed under `values` is shown through its label, never as the raw code.
# - `labels` are the table's column headers, in order, per language; the same headers are used in
#   downloads. A column with no label in a language is not shown in that language's table.
# - HR may edit the wording. Never add a placeholder that isn't a column in the query.
# - A test checks every placeholder, label and value code against the catalogue and the schema.

leave_balance:
  rows: many
  self:
    ar:
      intro: "رصيد إجازاتك:"
      row: "{leave_name_local} لسنة {fiscal_year}: متبقي {remaining} يوم. (رصيد أول السنة {opening_balance} · أُضيف {accrued_ytd} · استُخدم {used_ytd} · قيد الموافقة {pending_ytd})"
    en:
      intro: "Your leave balance:"
      row: "{leave_name} for {fiscal_year}: {remaining} days remaining. (Opening {opening_balance} · accrued {accrued_ytd} · used {used_ytd} · pending {pending_ytd})"
  team_member:
    ar:
      intro: "رصيد إجازات {subject_name}:"
      row: "{leave_name_local} لسنة {fiscal_year}: متبقي {remaining} يوم."
    en:
      intro: "{subject_name}'s leave balance:"
      row: "{leave_name} for {fiscal_year}: {remaining} days remaining."
  labels:
    ar:
      leave_name_local: "نوع الإجازة"
      fiscal_year: "السنة"
      opening_balance: "رصيد أول السنة"
      accrued_ytd: "أُضيف"
      used_ytd: "استُخدم"
      pending_ytd: "قيد الموافقة"
      remaining: "المتبقي"
    en:
      leave_name: "Leave type"
      fiscal_year: "Year"
      opening_balance: "Opening"
      accrued_ytd: "Accrued"
      used_ytd: "Used"
      pending_ytd: "Pending"
      remaining: "Remaining"

