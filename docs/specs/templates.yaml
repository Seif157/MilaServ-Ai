  team_member:
    ar:
      intro: "طلبات إجازة {subject_name}:"
      row: "{leave_name_local} من {start_date} إلى {end_date} ({working_days} يوم) — {status}"
    en:
      intro: "{subject_name}'s leave requests:"
      row: "{leave_name} from {start_date} to {end_date} ({working_days} days) — {status}"
  labels:
    ar:
      leave_name_local: "نوع الإجازة"
      start_date: "من"
      end_date: "إلى"
      working_days: "أيام العمل"
      is_half_day: "نصف يوم"
      status: "الحالة"
      reviewed_at: "تاريخ المراجعة"
    en:
      leave_name: "Leave type"
      start_date: "From"
      end_date: "To"
      working_days: "Working days"
      is_half_day: "Half day"
      status: "Status"
      reviewed_at: "Reviewed"
  values:
